repos:
  - https://dev.azure.com/example/project/_git/dashboards
upstream:
  auth: entraClientSecret
  entra:
    clientId: 00000000-0000-0000-0000-000000000001
    tenantId: 00000000-0000-0000-0000-000000000002
    clientSecret:
      existingSecret: my-entra-secret
      existingSecretKey: secret
proxyAuth: none
networkPolicy:
  enabled: true
ingress:
  enabled: true
  className: nginx
tls:
  existingSecret: git-proxy-tls
persistence:
  existingClaim: my-claim
