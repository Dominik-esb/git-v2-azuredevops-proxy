{{- $u := .Values.upstream }}
{{- $pat := and (eq $u.auth "pat") $u.pat.value (not $u.pat.existingSecret) }}
{{- $cs := and (eq $u.auth "entraClientSecret") $u.entra.clientSecret.value (not $u.entra.clientSecret.existingSecret) }}
{{- if or $pat $cs }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "git-proxy.credentialsSecret" . }}
  labels:
    {{- include "git-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $pat }}
  AZURE_PAT: {{ $u.pat.value | quote }}
  {{- else }}
  AZURE_CLIENT_SECRET: {{ $u.entra.clientSecret.value | quote }}
  {{- end }}
{{- end }}
