{{- if or .Values.serviceAccount.create (eq .Values.upstream.auth "entraWorkloadIdentity") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "git-proxy.serviceAccountName" . }}
  labels:
    {{- include "git-proxy.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The proxy never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
