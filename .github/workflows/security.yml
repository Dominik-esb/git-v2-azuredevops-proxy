name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch new CVEs in the base image even when nothing changes here.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-scan:
    name: Secrets & misconfiguration (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kustomize patches are partial Deployments; scanned on their own they look like workloads
      # with no securityContext, limits, etc. Scan what is actually applied: each rendered overlay.
      - name: Render kustomize overlays
        run: |
          set -eu
          mkdir -p k8s-rendered
          for k in $(find k8s -name kustomization.yaml | sort); do
            grep -q 'Not deployable alone' "$k" && continue
            dir=$(dirname "$k")
            grep -qE '^kind: *Component' "$k" && continue
            kubectl kustomize "$dir" > "k8s-rendered/$(echo "$dir" | tr / -).yaml"
            echo "rendered $dir"
          done

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          skip-files: "k8s/**/*-patch.yaml"
          format: sarif
          output: trivy-repo.sarif
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true

      - name: Upload to code scanning
        if: always() && hashFiles('trivy-repo.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo

      # Fails the build on leaked secrets only; misconfigurations are reported, not blocking.
      - name: Fail on secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          skip-setup-trivy: true

  image-scan:
    name: Image vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: git-proxy:scan
          # Like a release: no cache, so the apk upgrade layer has today's packages.
          no-cache: true

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: git-proxy:scan
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload to code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # What Artifact Hub's security report shows: every severity, including CVEs without a fix,
      # for this build and the latest release.
      - name: Summary (all severities, including unfixed)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          latest=$(curl -fsS https://hub.docker.com/v2/repositories/dominikesb/git-v2-azuredevops-proxy/tags/latest \
            | jq -r '.name' 2>/dev/null || true)
          {
            echo "### Image vulnerabilities"
            echo
            echo "| Image | Critical | High | Medium | Low | Unknown | Total | With fix |"
            echo "|---|---|---|---|---|---|---|---|"
            for img in git-proxy:scan ${latest:+dominikesb/git-v2-azuredevops-proxy:latest}; do
              trivy image --quiet --scanners vuln --format json "$img" | jq -r --arg img "$img" '
                [.Results[]?.Vulnerabilities[]?] as $v
                | def n(s): [$v[] | select(.Severity == s)] | length;
                "| \($img) | \(n("CRITICAL")) | \(n("HIGH")) | \(n("MEDIUM")) | \(n("LOW")) | \(n("UNKNOWN")) | \($v | length) | \([$v[] | select(.FixedVersion)] | length) |"'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
