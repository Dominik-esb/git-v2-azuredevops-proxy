# Read-only status page (STATUS_PAGE=on). Static files from the image plus the JSON that
# /usr/local/bin/git-proxy-status writes - no git data, URLs or credentials are served here.
location = / {
    root /usr/share/git-proxy/ui;
    try_files /index.html =404;
    include /etc/nginx/git-proxy-status-headers.conf;
}
location ~ ^/(app\.js|style\.css)$ {
    root /usr/share/git-proxy/ui;
    include /etc/nginx/git-proxy-status-headers.conf;
}
location = /status.json {
    root /tmp/status;
    default_type application/json;
    include /etc/nginx/git-proxy-status-headers.conf;
}
