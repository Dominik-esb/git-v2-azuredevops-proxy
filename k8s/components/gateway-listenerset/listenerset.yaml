apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: git-proxy
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: <gateway-name>
    namespace: <gateway-namespace>
  listeners:
    - name: https
      hostname: git-proxy.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: git-proxy-tls
