apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-proxy
  labels:
    app: git-proxy
spec:
  # One replica, recreated rather than rolled: the mirror lives on a ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git-proxy
  template:
    metadata:
      labels:
        app: git-proxy
    spec:
      securityContext:
        # Pod Security "restricted": unprivileged, no capabilities, read-only root filesystem.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Lets uid 10001 create its mirror on a fresh PVC whose root is owned by root. It changes the
        # group, not the owner, so a PVC the older root image wrote needs a one-time chown instead -
        # see "Upgrading" in ../../README.md.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-proxy
          # Pin a released version (see "Releases" in ../../README.md) rather than :latest, so a
          # pod restart cannot silently pick up a different image.
          image: DOCKERHUB_USERNAME/git-v2-azuredevops-proxy:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          env:
            # Single-repo mode. For several repos, mount a repos.conf instead (see ../../README.md).
            - name: AZURE_DEVOPS_URL
              value: https://dev.azure.com/<org>/<project>/_git/<repo>
            - name: SYNC_INTERVAL
              value: "60"
            # basic (default): the proxy generates a token per repo and prints it to the log.
            # none: no auth on the git endpoints - only with ../components/network-policy or similar.
            - name: GIT_PROXY_AUTH
              value: basic
          volumeMounts:
            - name: repos-data
              mountPath: /repos
            # The only other writable paths (readOnlyRootFilesystem): generated config, TLS
            # cert and Entra token; nginx and fcgiwrap runtime files.
            - name: config
              mountPath: /etc/git-proxy
            - name: tmp
              mountPath: /tmp
            # Optional: uncomment to supply your own TLS cert (apply ../tls-secret.yaml)
            # - name: tls
            #   mountPath: /etc/git-proxy/tls
            #   readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: repos-data
          persistentVolumeClaim:
            claimName: git-proxy-data
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # - name: tls
        #   secret:
        #     secretName: git-proxy-tls
