# their Azure DevOps credential. Not deployable alone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: git-proxy

resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
